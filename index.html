<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6D2A3A" />

    <!-- ============================================================
      SEO — PRIMARY META TAGS
      Replace title/description/keywords with the client's business
      details. See CLIENT_SETUP_GUIDE.md → "SEO".
    ============================================================ -->
    <title>[BUSINESS NAME] | Custom Cakes &amp; Bakery in [CITY]</title>
    <meta name="title" content="[BUSINESS NAME] | Custom Cakes &amp; Bakery in [CITY]" />
    <meta name="description" content="Order fresh birthday, anniversary, wedding &amp; custom cakes in [CITY]. Browse designs, pick a size and enquire on WhatsApp in seconds. Eggless options available." />
    <meta name="keywords" content="cake shop near me, birthday cake in [CITY], custom cake in [CITY], eggless cake, designer cake, anniversary cake, online cake order" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.example-cakeshop.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.example-cakeshop.com/" />
    <meta property="og:title" content="[BUSINESS NAME] | Custom Cakes &amp; Bakery in [CITY]" />
    <meta property="og:description" content="Freshly made cakes for birthdays, anniversaries, celebrations and every special occasion. Order on WhatsApp in a few clicks." />
    <meta property="og:image" content="/og-cover.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.example-cakeshop.com/" />
    <meta property="twitter:title" content="[BUSINESS NAME] | Custom Cakes &amp; Bakery in [CITY]" />
    <meta property="twitter:description" content="Freshly made cakes for birthdays, anniversaries, celebrations and every special occasion. Order on WhatsApp in a few clicks." />
    <meta property="twitter:image" content="/og-cover.jpg" />

    <!-- Fonts: Fraunces (display) + Public Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ============================================================
      LOCAL BUSINESS STRUCTURED DATA (JSON-LD)
      Update every field to match the client. See CLIENT_SETUP_GUIDE.md
    ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "[BUSINESS NAME]",
      "image": "/og-cover.jpg",
      "telephone": "[PHONE NUMBER]",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[SHOP ADDRESS]",
        "addressLocality": "[CITY]"
      },
      "servesCuisine": "Bakery",
      "priceRange": "$$",
      "sameAs": ["[INSTAGRAM URL]", "[FACEBOOK URL]"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
